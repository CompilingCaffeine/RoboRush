; Export presets for Robo Rush. Spec section 31.12: the game must be exportable to desktop
; and to web where supported.
;
; Four targets, all sharing one exclude filter. tests/ and tools/ are development-only —
; the suite, the art generators, and the audio generators have no business in a build a
; player downloads, and leaving them in would ship the whole test harness as dead weight.
;
; Building requires Godot's export templates for this exact engine version, which are a
; separate ~1 GB download and are NOT in this repository. There is no command-line flag to
; install them (--install-export-templates does not exist; only the Android build template
; has one). Either use the editor — Editor > Manage Export Templates > Download and Install —
; or fetch the archive and unpack it yourself:
;
;     curl -L -o templates.tpz \
;       https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
;     unzip -q templates.tpz -d tpz && \
;       mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable" && \
;       cp -R tpz/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.7.1.stable/"
;
; Then:
;
;     godot --headless --export-release "Linux" build/linux/robo_rush.x86_64
;
; macOS needs rendering/textures/vram_compression/import_etc2_astc enabled in project.godot,
; or a universal/arm64 export refuses to run. That is the entire content of the "configuration
; errors" it reports otherwise.
;
; The version fields below are rewritten from the git tag by tools/release.sh and put back
; afterwards, so the number inside a binary and the number on the release cannot disagree. What
; is checked in is the development value; it is not what ships.
;
; The bundle identifier is derived from the repository owner (CompilingCaffeine/RoboRush) and is
; now a real reverse-DNS id rather than the old com.roborush.game placeholder. It must not change
; again once anything has shipped under it: macOS keys the app's identity, its keychain items and
; its saved state to this string, and moving it turns an update into a different application.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, *.md"
export_path="build/macos/robo_rush.zip"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
binary_format/architecture="universal"
application/bundle_identifier="com.compilingcaffeine.roborush"
application/icon="res://art/ui/icon.png"
application/signature=""
application/app_category="Games"
application/short_version="1.0"
application/version="1.0"
application/copyright=""
display/high_res=true
codesign/codesign=0
notarization/notarization=0

